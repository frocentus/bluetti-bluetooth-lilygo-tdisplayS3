; Bluetti_ESP32_Bridge running on a LilyGo T-Display S3
; (ESP32-S3R8, 16MB flash, 8MB OPI PSRAM, 1.9" ST7789V 170x320 on 8-bit parallel)
;
; PlatformIO rather than the Arduino IDE on purpose: this project must build
; against arduino-esp32 2.0.x (platform 6.0.1) and NimBLE-Arduino 1.4.x, because
; the BLE code uses the BLE* class names (BLEDevice/BLEClient/BLEScan) that
; NimBLE-Arduino 2.x removed. Pinning that here keeps it out of a shared
; sketchbook that other projects rely on.
;
; Build:  pio run
; Flash:  pio run -t upload
; Watch:  pio device monitor

[platformio]
default_envs = lilygo_t_display_s3
; Sources live in the project root (Arduino IDE layout), not src/.
; This belongs in [platformio] - in [env:...] PlatformIO ignores it with a warning.
src_dir = .

[env:lilygo_t_display_s3]
platform = espressif32@6.0.1        ; -> arduino-esp32 2.0.x, do not bump blindly
board = lilygo-t-display-s3         ; boards/, vendored from Xinyuan-LilyGO/T-Display-S3
framework = arduino
monitor_speed = 115200

; The esptool bundled with PlatformIO 6.1.6 (4.4) kept dropping the S3 native-USB
; link part-way through write_flash on this machine (esptool error 31 /
; PermissionError), leaving a truncated app image that then boot-looped.
; Pinning the newest published tool package fixes it.
; If it ever regresses, flashing with a current standalone esptool works:
;   pip install -U esptool
;   esptool --chip esp32s3 --port COM5 --baud 460800 write-flash --compress \
;     --flash-mode dio --flash-freq 80m --flash-size 16MB \
;     0x0000 .pio/build/lilygo_t_display_s3/bootloader.bin \
;     0x8000 .pio/build/lilygo_t_display_s3/partitions.bin \
;     0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
;     0x10000 .pio/build/lilygo_t_display_s3/firmware.bin
platform_packages = platformio/tool-esptoolpy@1.40501.0
upload_speed = 460800

build_flags =
  ; The USB-C socket on this board is wired to the ESP32-S3 native USB
  ; peripheral (GPIO19/20). Without CDC-on-boot, Arduino's Serial goes to UART0
  ; on GPIO43/44, which this board does not break out - so every Serial.print
  ; in this project (and DEBUG logging) would silently go nowhere.
  ; Same two flags LilyGO's own platformio.ini uses.
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

  ; Must be a global flag, not a sketch-local #define: ElegantOTA.cpp is
  ; compiled separately and would otherwise link the synchronous WebServer
  ; implementation, giving "undefined reference to
  ; ElegantOTAClass::begin(AsyncWebServer*, ...)".
  -DELEGANTOTA_USE_ASYNC_WEBSERVER=1

  ; --- TFT_eSPI panel configuration --------------------------------------
  ; Defining USER_SETUP_LOADED makes TFT_eSPI skip its own User_Setup_Select.h,
  ; so the panel pinout lives here, versioned with the project, instead of in a
  ; globally shared library folder. Pin for pin identical to TFT_eSPI's
  ; User_Setups/Setup206_LilyGo_T_Display_S3.h and to LilyGO's own
  ; examples/tft/pin_config.h. Full panel spec: 170x320 8-bit parallel I8080.
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER=1
  -DCGRAM_OFFSET=1
  -DTFT_RGB_ORDER=0                  ; 0 = BGR, 1 = RGB
  -DTFT_INVERSION_ON=1
  -DTFT_PARALLEL_8_BIT=1
  -DTFT_WIDTH=170
  -DTFT_HEIGHT=320
  -DTFT_DC=7
  -DTFT_RST=5
  -DTFT_WR=8
  -DTFT_RD=9
  -DTFT_D0=39
  -DTFT_D1=40
  -DTFT_D2=41
  -DTFT_D3=42
  -DTFT_D4=45
  -DTFT_D5=46
  -DTFT_D6=47
  -DTFT_D7=48
  ; Defining TFT_BL + TFT_BACKLIGHT_ON makes TFT_eSPI drive the backlight in
  ; begin(). The panel power rail (GPIO15) is separate and handled in
  ; display_tft.cpp - without it the screen stays black no matter what.
  -DTFT_BL=38
  -DTFT_BACKLIGHT_ON=HIGH
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT6=1
  -DLOAD_FONT7=1
  -DLOAD_FONT8=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=1

; Versions are the newest that actually exist on the PlatformIO registry, which
; lags the Arduino Library Manager - do not paste versions from there.
lib_deps =
  h2zero/NimBLE-Arduino@1.4.1
  tzapu/WiFiManager@2.0.17
  knolleary/PubSubClient@2.8
  ESP32Async/AsyncTCP@3.4.1
  ESP32Async/ESPAsyncWebServer@3.7.4
  ayushsharma82/ElegantOTA@4.0.0
  bodmer/TFT_eSPI@2.5.0
